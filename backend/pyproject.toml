[tool.poetry]
name = "cloudwatcher"
version = "0.1.0"
description = "Backend API for CloudWatcher"
authors = ["Himanshu Shimpi <hrshimpi999@gmail.com>"]
readme = "../README.md"
packages = [{ include = "app" }]

[tool.poetry.scripts]
seed-db = "app.cli.seed:main"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.32.0" }
sqlalchemy = { extras = ["asyncio"], version = "^2.0.35" }
asyncpg = "^0.29.0"
alembic = "^1.13.3"
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
pandas = "^2.2.3"
statsmodels = "^0.14.4"
httpx = "^0.27.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.6.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: FastAPI's Depends()/Query() are meant to be called in argument
# defaults -- that's the framework's own dependency-injection pattern, not
# a bug. This is a well-known false positive for FastAPI code.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
